مصرية وعربية","name":"دليل الدوريات المصرية","desc":"دليل الدوريات العلمية المصرية","url":""},{"id":22,"cat":"أدلة وجهات مصرية وعربية","name":"النشرة المصرية للمطبوعات","desc":"ببليوجرافيا المطبوعات المصرية","url":""},{"id":23,"cat":"أدلة وجهات مصرية وعربية","name":"النشرة العربية للمطبوعات","desc":"ببليوجرافيا المطبوعات العربية","url":""},{"id":24,"cat":"أدلة وجهات مصرية وعربية","name":"جمعية اتحاد المكتبات الجامعية المصرية","desc":"الجمعية المهنية لمكتبات الجامعات المصرية","url":""},{"id":25,"cat":"أدلة وجهات مصرية وعربية","name":"المكتبة المركزية بجامعة حلوان","desc":"مكتبة جامعة حلوان","url":""},{"id":26,"cat":"أدلة وجهات مصرية وعربية","name":"النظم الآلية في المكتبات","desc":"مرجع ومقرر في نظم المكتبات الآلية","url":""}],"terms":[{"id":1,"ar":"الاجتماعات الدورية","en":"Periodic meetings","df":"اجتماعات منتظمة بين الإدارة والعاملين في المكتبة أو مركز المعلومات تسهم في تحقيق أهداف المكتبة وسياساتها وحل مشكلات العمل اليومية، وتوفر المعلومات اللازمة للرقابة الذاتية وسرعة اتخاذ القرارات.","src":[8],"tent":false},{"id":2,"ar":"الإجراءات","en":"Procedures","df":"مجموعة القواعد اللازمة لتنفيذ العمل، أو مجموعة التعليمات المكتوبة التي تصف الخطوات المتفق عليها لإنجاز عمل معين أو سلسلة من الأعمال.","src":[4],"tent":false},{"id":3,"ar":"الاحتياج التدريبي","en":"Training need","df":"الفجوة بين مستوى المعارف والمهارات والقدرات والاتجاهات التي يمتلكها الفرد فعليًا وبين المستوى المطلوب لأداء مهامه الوظيفية وتحقيق الأهداف التنظيمية، متى كان من الممكن معالجة هذه الفجوة من خلال التدريب والتطوير. وتشمل الاحتياجات المعرفية والمهارية والمرتبطة بالقدرات والسلوكية.","src":[8],"tent":false},{"id":4,"ar":"أحسن الممارسات","en":"Best practices","df":"طريقة أو آلية لإظهار أفضل النتائج والإنجازات التي تم تحقيقها، ويمكن استخدامها كمقياس؛ وهي منهجية ثبت بالتجربة والبحث أنها توصل إلى النتائج المرجوة.","src":[3],"tent":false},{"id":5,"ar":"الاختصار","en":"Abbreviation","df":"صورة مختصرة من كلمة أو عبارة تُستخدم بدلًا منها للإيجاز، وتتكون من حرف أو أكثر من حروفها.","src":[7],"tent":false},{"id":6,"ar":"الاختصار الحرفي (الأولي)","en":"Initialism","df":"اختصار يتكوّن من الحروف الأولى لعبارة ويُنطق حرفًا حرفًا (مثل: ISBN وALA).","src":[],"tent":true},{"id":7,"ar":"الاختصار النطقي (الأكرونيم)","en":"Acronym","df":"اختصار يتكوّن من الحروف الأولى لعبارة ويُنطق ككلمة واحدة (مثل: UNESCO).","src":[],"tent":true},{"id":8,"ar":"الإدارة","en":"Management (Administration)","df":"في اللغة: التصرف والمسايسة والتدبر واتخاذ القرار وتصريف الأمور وحسن التعامل معها. وفي الاصطلاح: فن أو علم توجيه وتسيير عمل الآخرين بقصد تحقيق أهداف محددة؛ وهي العملية الواعية التي تُستغل بها معارف البشر وخبراتهم وطاقاتهم وتُوجَّه بها الموارد المتاحة لتحقيق هدف ما.","src":[1],"tent":false},{"id":9,"ar":"إدارة الجودة الشاملة","en":"Total Quality Management (TQM)","df":"نظام لإدارة المنظمة يهدف إلى تحسين جودة المنتجات والخدمات وتحقيق رضا العملاء من خلال تطبيق المعايير العالية والمحافظة عليها.","src":[2],"tent":false},{"id":10,"ar":"إدارة الجودة في المكتبات","en":"Library quality management","df":"تطبيق مفاهيم إدارة الجودة الشاملة على المكتبة، بتخطيط أنشطتها وخدماتها وتنظيمها وقياسها باستمرار وفق معايير محددة لتلبية احتياجات المستفيدين ورفع رضاهم.","src":[],"tent":true},{"id":11,"ar":"إدارة المعرفة","en":"Knowledge management","df":"سلسلة من العمليات المنهجية التي تهدف إلى الحصول على المعرفة وتخزينها واسترجاعها وإعادة تكوينها بما يشكّل رأس المال الفكري للمنظمة.","src":[2],"tent":false},{"id":12,"ar":"إدارة المعلومات","en":"Information management","df":"مجموعة من العمليات الأساسية تتضمن تحديد الاحتياجات من المعلومات، والحصول عليها وإنشاءها، وتحليلها وتفسيرها، وتنظيمها وتخزينها، ونشرها وبثها، واستخدامها وتحقيق الاستفادة منها.","src":[2],"tent":false},{"id":13,"ar":"إدارة المكتبات","en":"Library management","df":"مجموعة الموارد البشرية والمادية والتكنولوجية والنظم الإدارية ومصادر المعلومات والتجهيزات (المدخلات) التي ينبغي أن تُدار بطريقة علمية صحيحة لأداء مجموعة من الأنشطة والمهام الأساسية (العمليات) لتحقيق الهدف الأساسي للمكتبة، وهو تلبية احتياجات المستفيد المعلوماتية من خلال تقديم الخدمات (المخرجات).","src":[1],"tent":false},{"id":137,"ar":"الأداء المعياري","en":"Standard performance","df":"هو الحد الأدنى من الاداء الذي يمكن قبوله","src":[5],"tent":false},{"id":14,"ar":"الأدلة والموجزات الإرشادية","en":"Library manuals","df":"مجموعة من القواعد والتعليمات والإجراءات والسياسات المكتوبة التي تستخدمها المكتبة كمساعدات تدريبية، خاصة للموظفين الجدد، ويتوقف نجاحها على دقة إعدادها ووضوحها.","src":[8],"tent":false},{"id":15,"ar":"أساليب التعليم والتعلم","en":"Teaching and learning methods","df":"الأساليب أو الطرق التي يستخدمها المدرّسون لمساعدة الطلاب في تحقيق النتائج التعليمية المستهدفة للمقرر، مثل تحليل المعلومات والوصول إلى قرار، والتعلم الذاتي، وإجراء التجارب.","src":[4],"tent":false},{"id":16,"ar":"الاستراتيجية","en":"Strategy","df":"كلمة يونانية الأصل (Strategos) تعني في الاصطلاح: فن القيادة العامة للحرب وجميع التدابير اللازمة لتحقيق النصر، أو علم تخطيط وتوجيه العمليات العسكرية الكبيرة، أو مهارة وبراعة في الإدارة والتخطيط.","src":[1],"tent":false},{"id":17,"ar":"الإسراف","en":"Waste (Extravagance)","df":"الهدر، أي الإنفاق بأكثر بكثير مما هو مطلوب أو ضروري أو مستحق؛ وقد يكون منع الإنفاق على ما يستحق إسرافًا غير مباشر لأنه سيكلّف كثيرًا للإصلاح أو التغيير لاحقًا.","src":[2],"tent":false},{"id":18,"ar":"أسلوب العرض","en":"Demonstration","df":"أن يؤدي المدرب عملًا معينًا بطريقة سليمة أمام المتدربين شارحًا لهم طريقة وإجراءات الأداء، ويصلح عادة في الأعمال الروتينية أو اليدوية مثل ختم الكتب أو تجليدها.","src":[8],"tent":false},{"id":19,"ar":"أسلوب المحاكاة","en":"Simulation","df":"تدريب على نموذج شبيه بالأصل إلى درجة كبيرة وضمن ظروف وشروط مسيطر عليها، يُستخدم عندما تكون هناك خطورة كبيرة أو تكلفة مرتفعة في التدريب المباشر على النموذج الحقيقي.","src":[8],"tent":false},{"id":20,"ar":"أسلوب المختبرات","en":"Lab training","df":"أسلوب يستخدم في مجال العلوم السلوكية، من أبرز أنواعه تدريب الحساسية (Sensitivity training) الذي ينمي الوعي بالنماذج السلوكية الخاصة بالفرد والآخرين، ويفيد في مهارات الاستماع وبناء فريق العمل وزيادة الثقة بالنفس.","src":[8],"tent":false},{"id":21,"ar":"إعادة الهندسة","en":"Reengineering","df":"تحديث وإعادة تصميم الأعمال في مؤسسة أو منظمة بهدف رفع كفاءتها وفاعليتها وتحسين مستوى الخدمات وجودتها مع تخفيض التكلفة، وتحقيق أقصى استفادة من تكنولوجيا المعلومات.","src":[2],"tent":false},{"id":22,"ar":"الاعتماد","en":"Accreditation","df":"مجموعة الإجراءات والعمليات التي تقوم بها هيئة الاعتماد للتأكد من أن المؤسسة التعليمية حققت شروط ومواصفات الجودة المعتمدة، وأن برامجها تتوافق مع المعايير المعلنة، وأن لديها أنظمة لضمان الجودة والتحسين المستمر لأنشطتها الأكاديمية.","src":[4,5],"tent":false},{"id":23,"ar":"الاعتماد الأكاديمي","en":"Academic accreditation","df":"الاعتراف بأن برنامجًا تعليميًا معينًا أو مؤسسة تعليمية تصل إلى مستوى الجودة والتميز؛ وهو أيضًا آلية تهدف إلى الارتقاء بجودة التعليم وضمان مستوى ومعايير محددة.","src":[5],"tent":false},{"id":24,"ar":"الاعتماد البرامجي","en":"Program accreditation","df":"تقويم برنامج أكاديمي بمؤسسة تعليمية والتأكد من جودته ومدى تناسبه لمستوى الشهادة الممنوحة بما يتفق مع المعايير العالمية المحددة.","src":[4],"tent":false},{"id":25,"ar":"الاعتماد المهني","en":"Professional accreditation","df":"منظومة متكاملة من الإجراءات تهدف إلى ضمان جودة إعداد الفرد وأدائه وتنميته مهنيًا باستمرار، من خلال اجتيازه برامج دراسية معينة (كالقانون أو الطب) بما يحقق متطلبات الترخيص وتجديده لمزاولة المهنة.","src":[4],"tent":false},{"id":26,"ar":"الاعتماد المؤسسي","en":"Institutional accreditation","df":"اعتماد المؤسسة ككل وفق معايير محددة حول كفاية المرافق والمصادر والعاملين والخدمات الأكاديمية والمناهج ومستويات الإنجاز؛ وعند استيفاء الحد الأدنى من المعايير تصبح معتمدة لفترة زمنية محددة.","src":[4,5],"tent":false},{"id":27,"ar":"أمين المكتبة","en":"Librarian (Information specialist)","df":"الأخصائي الذي ينظّم الكتب والمجلات والسجلات والمخطوطات وغيرها ويحفظها لتسهل على الرواد، ويخطط ويشرف على اقتنائها وتصنيفها وفهرستها وإعارتها، ويقدم الخدمات المعلوماتية التي تناسب احتياجات المستفيدين (ويُسمى أيضًا أخصائي معلومات).","src":[1],"tent":false},{"id":28,"ar":"الأهداف","en":"Goals (Objectives)","df":"الهدف هو المرمى أو الغاية أو القصد، والأهداف العامة للمؤسسة هي الغايات النهائية التي تسعى لتحقيقها. وتُصاغ وفق شروط منها: الارتباط بالرسالة والرؤية، والواقعية، والتحدي، والقابلية للقياس، والجدولة الزمنية.","src":[3,4],"tent":false},{"id":29,"ar":"الأهداف الاستراتيجية","en":"Strategic goals","df":"أهداف تُصاغ بشكل عام وشامل حول النتائج الكلية المطلوب تحقيقها، وتضعها الإدارة العليا على مستوى المنظمة ككل، وهي طويلة الأجل وغير محددة النهاية.","src":[3],"tent":false},{"id":30,"ar":"الأهداف التشغيلية","en":"Operational goals","df":"أهداف تشارك في صياغتها الإدارة الوسطى مع الإدارة الإشرافية على مستوى الأقسام والوحدات والأفراد؛ وهي أكثر تفصيلًا من التكتيكية وتُشتق منها، وقصيرة الأجل وتمثّل وسائل تحقيق الأهداف التكتيكية.","src":[3],"tent":false},{"id":31,"ar":"الأهداف التكتيكية","en":"Tactical goals","df":"أهداف تشارك في صياغتها الإدارة العليا والوسطى على مستوى القطاعات والإدارات؛ وهي متوسطة الأجل ولها نهايات محددة، وأكثر تحديدًا من الاستراتيجية وتُشتق منها وتمثّل الوسائل التي تتحقق بها.","src":[3],"tent":false},{"id":32,"ar":"أوعية المعلومات","en":"Information resources (information carriers)","df":"الأشكال والوسائط التي تحمل المعلومات وتُتاح للمستفيدين، سواء كانت تقليدية (كتب ودوريات) أو إلكترونية.","src":[],"tent":true},{"id":33,"ar":"برامج الإقامة","en":"Internship","df":"برامج تخرج بالعاملين من المكتبة بعيدًا عن موقع العمل مع إمدادهم بخبرات تعليمية جديدة، وتتم عن طريق الإعارة أو الانتداب الجزئي أو الكلي داخل القطر أو خارجه، وتحتاج إلى تكلفة مالية مرتفعة خاصة خارج القطر.","src":[8],"tent":false},{"id":34,"ar":"البرنامج الأكاديمي","en":"Academic program","df":"مجموعة من الآليات لتحقيق المعارف والمهارات والوجدانيات التي تقدمها الجامعة داخل جدرانها وخارجها لتحقيق مخرجات التعلم المنشودة من برنامج أكاديمي ما في فترة زمنية محدودة.","src":[4],"tent":false},{"id":35,"ar":"البوابة","en":"Portal","df":"موقع إلكتروني يمثّل نقطة دخول موحّدة تجمع روابط ومصادر وخدمات متنوعة في مكان واحد (مثل بوابة المكتبة الرقمية).","src":[],"tent":true},{"id":36,"ar":"البيروقراطية","en":"Bureaucracy","df":"الروتين المفرط، أي الإسهاب في الإجراءات الروتينية على حساب الوقت، والمغالاة في التمسك بالقواعد على حساب جودة العمل.","src":[2],"tent":false},{"id":37,"ar":"البيئة الخارجية","en":"External environment","df":"العوامل والظروف خارج المكتبة التي تؤثر فيها ولا تتحكم فيها (الفرص والتحديات)، وتُحلَّل ضمن التحليل البيئي عند التخطيط الاستراتيجي.","src":[1,3],"tent":true},{"id":38,"ar":"البيئة الداخلية","en":"Internal environment","df":"العوامل داخل المكتبة التي تتحكم فيها الإدارة (نقاط القوة والضعف: الموارد والعاملون والخدمات والهيكل التنظيمي)، وتُحلَّل ضمن التحليل البيئي.","src":[1,3],"tent":true},{"id":39,"ar":"تحديد الاحتياجات التدريبية","en":"Training needs determination","df":"عملية تشخيصية منهجية تهدف إلى اكتشاف الفجوات الموجودة بين الكفاءات الحالية للعاملين والكفاءات المطلوبة لأداء وظائفهم، والتعرف على المجالات والفئات التي تحتاج إلى تدخل تدريبي.","src":[8],"tent":false},{"id":40,"ar":"التحليل الاستراتيجي","en":"Strategic analysis","df":"مرحلة في التخطيط الاستراتيجي يتم فيها تحليل البيئة الداخلية والخارجية للمؤسسة (باستخدام تحليل سوات) قبل إعداد الخطة الاستراتيجية.","src":[1],"tent":false},{"id":41,"ar":"التحليل البيئي (سوات)","en":"SWOT analysis (Environmental analysis)","df":"أداة تفحص نقاط القوة (Strengths) والضعف (Weaknesses) داخل المكتبة، والفرص (Opportunities) والتحديات (Threats) في بيئتها الخارجية، ويُعتمد على نتائجها في وضع الخطط الاستراتيجية.","src":[1,3],"tent":false},{"id":42,"ar":"تحليل الوظائف","en":"Job analysis","df":"عملية منظمة لجمع المعلومات عن كل وظيفة بغرض التعرف على وصفها ومتطلباتها ومواصفاتها وطبيعتها، أي تحليل العمل إلى مكوناته من مهام ومسؤوليات وعلاقات وظروف عمل وقدرات ومهارات لازمة.","src":[1],"tent":false},{"id":43,"ar":"التخطيط","en":"Planning","df":"عملية ذهنية تتضمن الاختيار الواعي للحلول طبقًا للأهداف في ضوء الحقائق والمعلومات المتاحة؛ وهو تحديد الأهداف ورسم الطرق لاستخدام الموارد أفضل استخدام، ويجيب عن: ماذا نريد بالضبط؟ وكيف نحققه؟ ومتى؟","src":[1],"tent":false},{"id":44,"ar":"التخطيط الاستراتيجي","en":"Strategic planning","df":"الجهد المنظم الهادف إلى صناعة قرارات مصيرية تشكّل هوية المؤسسة وتبرّر وجودها، ويمكّنها من تحقيق رؤيتها ورسالتها وأهدافها بكفاءة وفاعلية بما يحقق رضا المستفيدين في ضوء الظروف البيئية الداخلية والخارجية؛ وهو خارطة توضح أين أنت الآن وأين ترغب أن تكون.","src":[1],"tent":false},{"id":45,"ar":"تخطيط البرامج التدريبية","en":"Training program planning","df":"وضع مجموعة البرامج التدريبية التي تصمم لتلبي متطلبات المستفيدين واحتياجاتهم، وهي المرحلة التالية لعمليات تحديد الاحتياجات التدريبية.","src":[8],"tent":false},{"id":46,"ar":"التدريب","en":"Training","df":"عملية شاملة تتناول جميع التدابير اللازمة لإيصال الفرد إلى وضع يمكنه من الاضطلاع بوظيفة معينة، وإنجاز المهام التي تتطلبها هذه الوظيفة، وجعله قادرًا على متابعة العمل؛ وهو الجهود الهادفة إلى تزويد الموظف بالمعلومات والمعارف التي تكسبه مهارة وخبرات تزيد من كفاءته في أداء عمله الحالي، أو تعده لأداء أعمال ذات مستوى أعلى في المستقبل القريب.","src":[8],"tent":false},{"id":47,"ar":"التدريب أثناء العمل","en":"On-the-job training","df":"أسلوب يتولاه عادة الرئيس المباشر أو أحد العاملين القدامى ممن لديهم خبرة طويلة ومعلومات فنية وقدرة على الشرح والتطبيق، ويكون فيه التدريب مرتبطًا في الغالب بالعمل الفعلي للمتدرب.","src":[8],"tent":false},{"id":48,"ar":"التدريب في مراكز تدريب متخصصة","en":"Specialized training","df":"تدريب يتم في ظروف مماثلة لظروف العمل داخل مراكز أو قاعات تدريبية متخصصة مجهزة بالأدوات والأجهزة اللازمة، فيتفادى تعطيل العمل في المكتبة ويركز على تعليم الفرد مهارات محددة.","src":[8],"tent":false},{"id":49,"ar":"التدريب كنظام","en":"Training system","df":"النظر إلى التدريب من مفهوم النظم: مدخلات (القوى البشرية من مدربين ومتدربين وإداريين وفنيين، والمعلومات، والمدخلات التكنولوجية)، وعمليات (الاحتياجات والأهداف والمحتوى والمهارات والاتجاهات)، ومخرجات (الأفراد الذين تدربوا، وزيادة الإنتاجية، وارتفاع مستوى الأداء، وزيادة العائد، وارتفاع وعي المتدربين بمشكلات العمل).","src":[8],"tent":false},{"id":50,"ar":"تدوير الوظائف","en":"Job rotation","df":"إلحاق المتدرب بعدد من الوظائف المختلفة داخل المكتبة لفترات مؤقتة للإحاطة بأوجه نشاطها والدراية بعمل الأقسام الأخرى، مما يتيح المرونة في تحريك الموظف؛ ويناسب المكتبات الكبيرة ذات الأقسام المتعددة.","src":[8],"tent":false},{"id":51,"ar":"التصنيف المعياري الدولي للمهن (آيسكو)","en":"International Standard Classification of Occupations (ISCO)","df":"نظام يصنّف الأشخاص وفق علاقتهم الفعلية والمحتملة بالوظائف، وتُصنَّف الوظائف حسب الأعمال المنجزة، والمعيار الأساسي لتصنيفها مستوى المهارات والتخصص المطلوب.","src":[6],"tent":false},{"id":52,"ar":"التعلم الذاتي","en":"Self-learning","df":"أسلوب يقع فيه عبء التدريب على الموظف ذاته مستعينًا بالكتيبات والشرائط المسجلة أو بالتعلم من خلال مواقع التدريب على الإنترنت، وهو ذو تكلفة أقل نسبيًا من غيره.","src":[8],"tent":false},{"id":53,"ar":"التغذية العكسية","en":"Feedback","df":"معلومات راجعة عن نتائج النظام (المخرجات) تعود إليه لتقييم أدائه وتعديل المدخلات والعمليات؛ وفي التخطيط هي قياس نتائج القرارات التخطيطية على ضوء الأهداف والتوقعات عن طريق التقييم المرتد المنظم.","src":[1],"tent":false},{"id":54,"ar":"تقدير الاحتياجات التدريبية","en":"Training needs assessment","df":"عملية تحليل وتقويم الاحتياجات التي تم التعرف عليها، بهدف تحديد حجمها وأهميتها ودرجة إلحاحها وأولوياتها، ومدى تأثيرها في الأداء المؤسسي، وتحديد مدى قابلية التدريب لمعالجتها.","src":[8],"tent":false},{"id":55,"ar":"التقويم","en":"Evaluation","df":"تحليل أداء المؤسسات والبرامج التعليمية وقياس مستوى جودة مخرجاتها وتحديد جوانب القصور وما يلزم لتلافيها لتحقيق مستوى الجودة المطلوب.","src":[4],"tent":false},{"id":56,"ar":"التقويم الكمي","en":"Quantitative evaluation","df":"تقويم يركز فيه الفريق على وضع الأحكام بصورة رقمية، بالنظر الدقيق إلى عناصر أداء المؤسسة كل على حدة من ناحية كمية (جودة المدخلات والعمليات والمخرجات).","src":[4],"tent":false},{"id":57,"ar":"التقويم النوعي","en":"Qualitative evaluation","df":"تقويم تُستخدم فيه أدوات كالمناقشات والمقابلات والملاحظات وفحص السجلات ودراسة الحالات والاستبانات، ثم يلخص الفريق النتائج والأحكام في ضوء الأدلة المتجمعة.","src":[4],"tent":false},{"id":58,"ar":"تقييم البرامج التدريبية","en":"Training program evaluation","df":"الإجراءات التي تقاس بها كفاءة البرامج التدريبية ومدى نجاحها في تحقيق أهدافها المنشودة، ومن أساليبها الاستبانة والملاحظة المباشرة والنقاش الجماعي لنقاط القوة والضعف، ويشارك فيها إدارة البرنامج والمدربون والمتدربون.","src":[8],"tent":false},{"id":59,"ar":"التنظيم","en":"Organizing","df":"عملية تصنيف الأنشطة ثم ترتيبها ثم توزيع الموظفين على الوظائف بتوزيع السلطات والمهام والمسؤوليات بطريقة تحقق الأهداف بسرعة؛ وهدفه الأساسي تنفيذ الخطة.","src":[1],"tent":false},{"id":60,"ar":"تنفيذ البرامج التدريبية","en":"Training program implementation","df":"مرحلة إدارة البرامج التدريبية وإخراجها إلى حيز الوجود، وتشمل تحضير مستلزمات البرنامج، وافتتاحه وشرح أهدافه ومتطلباته للمتدربين، وحسن إدارة جلسات التدريب والزيارات والأنشطة المكملة، ونهاية التدريب وتوزيع الشهادات على المتدربين.","src":[8],"tent":false},{"id":61,"ar":"تنمية القدرات","en":"Development","df":"زيادة قدرات الإنسان لتحسين مكانته الوظيفية أو لأداء واجبات إضافية أو القيام بمسؤوليات أكبر، ويجب التفرقة بينها وبين مفهوم التدريب.","src":[8],"tent":false},{"id":62,"ar":"التوجيه","en":"Directing (Leading)","df":"إرشاد وتحفيز الأفراد (المرؤوسين) أثناء تنفيذهم للأعمال في الاتجاهات المناسبة لتحقيق الأهداف المطلوبة؛ ويتعلق بالاتصال والقيادة والإشراف والتحفيز.","src":[1],"tent":false},{"id":63,"ar":"التوظيف","en":"Staffing","df":"النشاط الذي يقتضي الإعلان عن الوظائف الشاغرة وترغيب الأفراد المؤهلين للعمل في المكتبة؛ أو سلسلة الإجراءات اللازمة لتزويد المكتبة بالكوادر البشرية لشغل الوظائف.","src":[1],"tent":false},{"id":64,"ar":"الثقافة التنظيمية","en":"Organizational culture","df":"مجموعة المعتقدات والسلوكيات والعادات والتقاليد السائدة (الفردية أو الجماعية) والقيم المتوارثة في بيئة أو منظمة معينة، وكذلك القوانين واللوائح الحاكمة للعمل.","src":[2],"tent":false},{"id":65,"ar":"الجمعيات المهنية","en":"Library associations","df":"تشجيع العاملين على الانتساب إلى الجمعيات المهنية المتخصصة في مجال المكتبات والمعلومات والمشاركة في فعالياتها من ندوات ومؤتمرات ودورات وورش عمل.","src":[8],"tent":false},{"id":66,"ar":"الجودة","en":"Quality","df":"لغةً: من «جاد» أي أتى بالجيد؛ واصطلاحًا: الدرجة التي تُشبع فيها الحاجات والتوقعات الظاهرة والضمنية (تعريف ISO)؛ وهي المطابقة لمتطلبات أو مواصفات معينة، وجملة السمات والخصائص التي تجعل المنتج أو الخدمة قادرًا على الوفاء باحتياجات معينة.","src":[4,5],"tent":false},{"id":67,"ar":"جودة إدارة المكتبات","en":"Quality of library management","df":"درجة قدرة الإدارة على تشغيل المكتبة (تخطيطًا وتنظيمًا وتوظيفًا وتوجيهًا ورقابة) بما يحقق المعايير ويلبي احتياجات المستفيدين.","src":[],"tent":true},{"id":68,"ar":"جودة خدمات المكتبات","en":"Library services quality","df":"إلى أي مدى تلبي الخدمات التي تقدمها المكتبة احتياجات مستخدميها، علمًا بأنها تتأثر بالقيود المالية والسياسات الإدارية وحالة المرافق والقرارات الشخصية والحالة المعنوية للعاملين.","src":[5],"tent":false},{"id":69,"ar":"حضور المعارض","en":"Exhibitions","df":"حضور العاملين على اختلاف مستوياتهم الإدارية المعارض الوطنية والعربية والدولية للكتب أو الأثاث المكتبي أو الأجهزة والأدوات المكتبية أو تقنيات الحاسبات.","src":[8],"tent":false},{"id":70,"ar":"الحوكمة","en":"Governance","df":"الحوكمة الجيدة تعني أن اتخاذ القرار داخل المكتبة يعتمد على أخلاقيات المنظمة وثقافتها ومعاييرها وممارساتها وسلوكياتها وهياكلها وعملياتها، بما يخلق منظمة ذات هدف واضح تقدم قيمة طويلة الأمد تتوافق مع توقعات أصحاب المصلحة المعنيين.","src":[2],"tent":false},{"id":71,"ar":"الخريطة التنظيمية","en":"Organization chart","df":"شكل بياني يوضح خطوط السلطة الرسمية للإدارات والوحدات الفرعية وعلاقتها ببعضها وقنوات الإشراف وحدود سلطات الموظفين، ويرسم الصورة الكلية للتنظيم الإداري بالمؤسسة.","src":[1],"tent":false},{"id":72,"ar":"الخصوصية","en":"Privacy","df":"حماية الخصوصية والسرية للمستفيد، وهي مرتبطة بالحرية الفكرية وحرية تداول المعلومات، وتُعد من القيم الأساسية للمهنة.","src":[1],"tent":false},{"id":73,"ar":"الخطة التنفيذية","en":"Executive (action) plan","df":"الخطة التي تترجم أهداف استراتيجية المؤسسة إلى أنشطة ومهام محددة، لكل منها توقيت ومسؤول تنفيذ ومؤشرات متابعة وتقييم أداء.","src":[1],"tent":false},{"id":74,"ar":"دراسة الحالة","en":"Case study","df":"صورة موجزة تصف الطريقة التي عالج بها موظف أو عدد من الموظفين مواقف أو مشكلات عملية منتقاة وكيفية اتخاذ القرار بشأنها، والهدف إعطاء المتدرب فرصة للتفكير المنطقي والتحليل الواقعي والشامل للحالات والمشكلات.","src":[8],"tent":false},{"id":75,"ar":"الدورات التدريبية قصيرة الأجل","en":"Special short-term courses","df":"برامج تكون عادة مزيجًا من قاعة الدرس وخبرة العمل، وتهدف غالبًا إلى تنشيط وتجديد معلومات المكتبيين وإبقائهم على اتصال بالتطورات الحديثة (دورات تنشيطية).","src":[8],"tent":false},{"id":76,"ar":"رأس المال الفكري","en":"Intellectual capital","df":"المهارات والمعارف لدى العاملين بالمنظمة التي يمكن استخدامها لجعل المنظمة أكثر نجاحًا من منافسيها.","src":[2],"tent":false},{"id":77,"ar":"الرسالة","en":"Mission","df":"بيان مكتوب يحدد السمات التي تميز المكتبة عن غيرها من المكتبات المماثلة والغرض من وجودها، ويضع الملامح الرئيسية للخدمات والأنشطة التي تقدمها؛ وهي مبرر الوجود في المجتمع، ويُشترط ألا تتجاوز مائة كلمة.","src":[1,3],"tent":false},{"id":78,"ar":"الرغبة التدريبية","en":"Training want","df":"ميل الفرد أو اهتمامه الشخصي بالالتحاق ببرنامج تدريبي أو اكتساب معرفة أو مهارة معينة، دون أن يعني ذلك بالضرورة وجود فجوة فعلية في متطلبات وظيفته الحالية.","src":[8],"tent":false},{"id":79,"ar":"الرقابة","en":"Controlling","df":"الوظيفة الخامسة والأخيرة من وظائف الإدارة، وتتعلق بمتابعة تنفيذ الخطة والأهداف؛ وخطواتها: إعداد معايير الأداء، ومتابعة الأداء الفعلي، وقياس الأداء، وتصحيح الانحراف.","src":[1],"tent":false},{"id":80,"ar":"الرؤية","en":"Vision","df":"أحلام المكتبة وطموحاتها التي لا يمكن تحقيقها في ظل الإمكانيات الحالية وإن أمكن الوصول إليها في الأجل الطويل؛ أو هي التصور العقلي للحالة المستقبلية للمؤسسة والموقع الذي تتوخى أن تتبوأه.","src":[3,4],"tent":false},{"id":81,"ar":"الزيارات الميدانية للمكتبات","en":"Field visits","df":"زيارات للمكتبات المشابهة تساعد على تبادل الآراء والأفكار والاستفادة من خبرات الغير ونقل الأساليب والنماذج الجيدة، ويمكن إثراؤها بمناقشة نتائج الزيارة ومتابعتها.","src":[8],"tent":false},{"id":82,"ar":"السرية","en":"Confidentiality","df":"عدم إفشاء بيانات المستفيد أو معلومات المكتبة (كسجلات الإعارة والبيانات الشخصية) لغير المصرح لهم.","src":[],"tent":true},{"id":83,"ar":"السياسة","en":"Policy","df":"مجموعة من المبادئ والقواعد العامة المكتوبة التي توجّه القرارات وتنظّم العمل في المكتبة (مثل سياسة بناء المجموعات)، وتُشتق من الأهداف الاستراتيجية.","src":[],"tent":true},{"id":84,"ar":"شروط الأهداف الاستراتيجية (سمارت)","en":"SMART goals","df":"أن تكون الأهداف: محددة (Specific)، قابلة للقياس (Measurable)، قابلة للتحقيق (Achievable)، واقعية (Realistic)، موقوتة (Timed).","src":[1],"tent":false},{"id":85,"ar":"صفحة الويب","en":"Webpage","df":"وثيقة إلكترونية مكتوبة بلغة HTML تُخزَّن على خادم ويب ويُوصل إليها باستخدام برنامج متصفح.","src":[7],"tent":false},{"id":86,"ar":"ضبط الجودة","en":"Quality control","df":"نظام يحقق مستويات مرغوبة في المنتج عن طريق فحص عينات منه؛ أو الإشراف على العمليات الإنتاجية لتحقيق منتج بالجودة المطلوبة؛ وهو الخطوة الأساسية التي تسبق ضمان الجودة.","src":[4],"tent":false},{"id":87,"ar":"ضمان الجودة","en":"Quality assurance","df":"استيفاء الجودة لجميع عناصر العملية التعليمية (مناهج ومرافق وطلاب وأعضاء هيئة تدريس وأنشطة) وفق معايير محددة؛ أو الحفاظ على المستوى المطلوب من الجودة في الخدمة أو المنتج.","src":[4,5],"tent":false},{"id":88,"ar":"ضمان جودة التعليم","en":"Education quality assurance","df":"عملية التحقق من أن المعايير الأكاديمية المتوافقة مع رسالة المؤسسة التعليمية قد حُددت وتحققت بما يتوافق مع المعايير المناظرة قوميًا وعالميًا، وأن جودة التعليم والبحث والمشاركة المجتمعية ملائمة لتوقعات المستفيدين.","src":[5],"tent":false},{"id":89,"ar":"العصف الذهني","en":"Brainstorming","df":"إحدى عمليات المناقشة الجماعية التي يشجع فيها المدرب أفراد الجماعة على توليد أكبر عدد من الأفكار والمقترحات خلال فترة قصيرة، ثم تحليلها بعد جمعها ومناقشتها؛ ويستخدم لتطوير مهارات التفكير الخلاق.","src":[8],"tent":false},{"id":90,"ar":"العمليات","en":"Processes","df":"مجموعة من الأنشطة والاتصالات المترابطة لتحقيق هدف، تأخذ مدخلًا أو أكثر وتحوّلها إلى مخرجات؛ وفي المكتبة هي العمليات الفنية كالفهرسة والتصنيف والتحليل الموضوعي والتكشيف والاستخلاص.","src":[1,4],"tent":false},{"id":91,"ar":"العملية الإدارية","en":"Management process","df":"الوظائف الأساسية المتتابعة التي تمارسها الإدارة لتحقيق الأهداف: التخطيط، التنظيم، التوظيف، التوجيه (القيادة)، الرقابة.","src":[1],"tent":false},{"id":92,"ar":"العملية التدريبية","en":"Training process","df":"مراحل أساسية منطقية ومنهجية متعاقبة، تبدأ بتقدير الاحتياجات التدريبية بغية وضع الأهداف والخطط لإشباعها، ثم وضع الميزانيات، ثم تنفيذ البرامج، ثم تقييمها وفقًا للخطة والأهداف المحددة سلفًا، ثم متابعة التدريب؛ وتنعكس دقة تقدير الاحتياجات على سلامة العملية التدريبية ذاتها.","src":[8],"tent":false},{"id":93,"ar":"الفساد","en":"Corruption","df":"عدم الصدق والنزاهة والسلوك غير القانوني لبعض المناصب الإدارية، أو السياسات والممارسات والإجراءات غير الشفافة في إدارة المنظمة، ويشمل الرشوة والانحراف.","src":[2],"tent":false},{"id":94,"ar":"القدرة","en":"Ability","df":"الاستعداد أو الطاقة الكامنة لدى الفرد لأداء عمل ما أو لتعلّم مهارة، سواء استُخدمت فعليًا أو لا.","src":[],"tent":true},{"id":95,"ar":"القراءات الخاصة","en":"Special readings","df":"متابعة قراءة الكتب والأبحاث والمقالات المتخصصة في مجالات المكتبات والمعلومات للوقوف على أحدث التطورات، ويفيد عقد ندوات وجلسات دورية للمناقشة وتنمية عادة القراءة.","src":[8],"tent":false},{"id":96,"ar":"القيم","en":"Values","df":"مجموعة المبادئ والتوجيهات والضوابط الأخلاقية والمهنية والسلوكية التي تحدد هوية المؤسسة وتوجّه عملها (مثل الإخلاص والصدق والأمانة والعدل والخدمة).","src":[1],"tent":false},{"id":97,"ar":"الكفاءة","en":"Competency","df":"القدرة على توظيف المعارف والمهارات والاتجاهات لأداء العمل بالمستوى المطلوب، وفي الإدارة إنجاز العمل بأقل جهد وتكلفة ممكنة.","src":[],"tent":true},{"id":98,"ar":"لعب الأدوار","en":"Role playing","df":"أسلوب يقوم على المشاركة الفعلية للمتدربين في بناء مواقف مصطنعة يمنح فيها كل متدرب دورًا، ويفيد في زيادة مهارات معالجة المشكلات المتصلة بالعلاقات الإنسانية، وتغيير الاتجاهات وتشكيل نماذج سلوكية جديدة.","src":[8],"tent":false},{"id":99,"ar":"مبدأ الكفاءة","en":"Merit (efficiency) principle","df":"اختيار أفضل العناصر المتقدمة للوظائف المعلن عنها وأكثرها قدرة على القيام بها.","src":[1],"tent":false},{"id":100,"ar":"مبدأ تكافؤ الفرص","en":"Equal opportunity principle","df":"إعطاء فرص متساوية لجميع المتقدمين لشغل الوظيفة المعلن عنها.","src":[1],"tent":false},{"id":101,"ar":"متابعة التدريب","en":"Training follow-up","df":"مرحلة تتم بعد انقضاء فترة زمنية مناسبة على البرنامج التدريبي وعودة المتدربين إلى أعمالهم، بهدف تقييم مدى استفادة المتدربين من البرنامج والتغير والتحسن في أدائهم.","src":[8],"tent":false},{"id":102,"ar":"المحاضرات","en":"Lectures","df":"أسلوب تدريبي مباشر تعرض فيه الحقائق والأفكار عن موضوع معين بشكل مرتب ومنسق على عدد كبير من المتدربين في وقت واحد، مع زيادة فرصة الاحتكاك بالخبراء والمتخصصين.","src":[8],"tent":false},{"id":103,"ar":"المخرجات","en":"Outputs","df":"الجوانب المنتجة من النظام التي تحكمها العلاقات بين متغيراته وقيم المدخلات؛ وفي المكتبة هي الخدمات: الإعارة والإرشاد والاطلاع والتصوير والترجمة والبث الانتقائي للمعلومات.","src":[1,4],"tent":false},{"id":104,"ar":"مخرجات التعلم المستهدفة","en":"Intended learning outcomes (ILOs)","df":"ما يُتوقع أن يكتسبه الطالب عند إكمال البرنامج الأكاديمي، وتشمل: المعرفة والفهم، والمهارات العقلية، والمهارات المهنية والعملية، والمهارات العامة.","src":[4],"tent":false},{"id":105,"ar":"المدخلات","en":"Inputs","df":"الحجم الكلي للموارد المخصصة لتشغيل نظام ما، وتشمل الموارد البشرية والمادية والمالية والتقنية والمعلومات والوقت.","src":[4],"tent":false},{"id":106,"ar":"المستفيد","en":"User","df":"الفرد أو الجهة (طالب، باحث، عضو هيئة تدريس…) الذي تقدم له المكتبة خدماتها لتلبية احتياجاته المعلوماتية الحالية والمتوقعة.","src":[],"tent":true},{"id":107,"ar":"المستودع الرقمي","en":"Digital repository","df":"نظام على الإنترنت لجمع الإنتاج الفكري الرقمي للمؤسسة (بحوث ورسائل وغيرها) وحفظه وتنظيمه وإتاحته مع بياناته الوصفية.","src":[],"tent":true},{"id":108,"ar":"المستودع السحابي","en":"Cloud repository","df":"مساحة تخزين على خوادم سحابية تُحفظ فيها الملفات والبيانات وتُتاح عبر الإنترنت من أي مكان مع إمكانات المشاركة والنسخ الاحتياطي.","src":[],"tent":true},{"id":109,"ar":"المعرفة والفهم","en":"Knowledge and understanding","df":"المعلومات الأساسية والمفاهيم التي يجب أن يكتسبها الطالب عند إكمال البرنامج الأكاديمي حتى التخرج.","src":[4],"tent":false},{"id":110,"ar":"المعلومات","en":"Information","df":"كل الأفكار والآراء والحقائق والأعمال الإبداعية للعقل التي يتم تداولها أو يمكن تداولها بطريقة رسمية أو غير رسمية وفي أي شكل، تقليدي أو غير تقليدي.","src":[1],"tent":false},{"id":111,"ar":"المعيار","en":"Standard","df":"ما اتُّخذ أساسًا للمقارنة والتقدير؛ وهو مواصفة مقبولة على نطاق واسع لما ينبغي أن يكون عليه الشيء، ومجموعة محددة مسبقًا من القواعد والشروط والمتطلبات لقياس الجودة. والمعيار خاصية عامة مجردة يجب احترامها، أما المؤشر فعلامة يمكن ملاحظتها داخله.","src":[3,4],"tent":false},{"id":112,"ar":"المقاييس المرجعية","en":"Benchmarks","df":"مقارنة ممارسات منظمة وأدائها بمنظمة أخرى لتحديد المعايير أو أفضل الممارسات وتطبيقها عند قياس الأداء وتحسينه؛ والمقياس المرجعي معيار أو مجموعة معايير تُستخدم كنقطة مرجعية لتقييم الأداء أو مستوى الجودة.","src":[3],"tent":false},{"id":113,"ar":"المكتبة","en":"Library","df":"الكيان (المادي أو المعنوي) الذي ينتقي ويقتني الإنتاج الفكري بكافة أشكاله ثم ينظمه فنيًا بهدف تلبية الاحتياجات المعلوماتية للمستفيدين الحاليين والمتوقعين؛ ووظائفها: الانتقاء والاقتناء، والتنظيم والتحليل الفني، وتقديم الخدمات المعلوماتية.","src":[1],"tent":false},{"id":114,"ar":"المكتبة الجامعية","en":"University library (Academic library)","df":"مكتبة جامعة أو نظام مكتبة تنشئه وتديره وتموله الجامعة للوفاء بالاحتياجات المعلوماتية والبحثية والتعليمية للطلاب وأعضاء هيئة التدريس والعاملين بها؛ وتُعد المكتبات الضخمة منها مكتبات بحثية.","src":[3],"tent":false},{"id":115,"ar":"المنصة","en":"Platform","df":"بيئة أو نظام رقمي (برمجي) يوفر بنية موحدة لتشغيل الخدمات أو التطبيقات أو المحتوى وتفاعل المستخدمين معه (مثل منصة التعلم الإلكتروني).","src":[],"tent":true},{"id":116,"ar":"المنظمة المتعلمة","en":"Learning organization","df":"المنظمة التي تتبنى استراتيجيات توجه أفرادها لامتلاك القدرة على التعلم المستمر والعمل كفريق والإفادة من التكنولوجيا الحديثة لتبادل الخبرات، برؤية واضحة تجعلهم قادرين على التنبؤ بالمتغيرات والتفاعل معها.","src":[2],"tent":false},{"id":117,"ar":"المنهاج","en":"Curriculum","df":"مجموعة مميزة ومنظمة من المقررات الدراسية تؤدي إلى منح الدرجة الأكاديمية المرتبطة بالبرنامج (بكالوريوس، ماجستير…).","src":[4],"tent":false},{"id":118,"ar":"المهارات العامة","en":"General skills","df":"المهارات الواجب توافرها في الخريجين التي ترتقي بأدائهم أثناء ممارسة المهنة أو تساعدهم على تغيير توجهاتهم حسب سوق العمل، وتضم: اللغة، واستخدام تكنولوجيا المعلومات، والتواصل مع الآخرين، والإدارة.","src":[4],"tent":false},{"id":119,"ar":"المهارات العقلية","en":"Cognitive skills","df":"المهارات التي يكتسبها الخريج مثل القدرة على المناقشة والتفكير الاستدلالي والناقد والإبداعي وتحديد المشكلات وحلها.","src":[4],"tent":false},{"id":120,"ar":"المهارات المهنية والعملية","en":"Practical skills","df":"القدرة على استخدام المقرر الدراسي في تطبيقات مهنية، ويجب أن يكتسبها الطالب عند إكمال البرنامج الأكاديمي.","src":[4],"tent":false},{"id":121,"ar":"المهارة","en":"Skill","df":"القدرة المكتسبة بالتعلم والممارسة على أداء مهام وأعمال محددة بإتقان؛ وتُصنَّف المهن حسب مستوى المهارات والتخصص المطلوب لتنفيذ أعمالها.","src":[6],"tent":true},{"id":122,"ar":"المهام الخاصة","en":"Special assignments","df":"أسلوب مرن يسند بموجبه للمتدرب أعباء خاصة يترك له الحرية في أسلوب معالجتها، مثل رئاسة لجنة معينة أو الإشراف على تطبيق نظام جديد، ويهدف إلى إكسابه القدرة على التوازن والتكيف مع مواقف معينة.","src":[8],"tent":false},{"id":123,"ar":"المهنة","en":"Occupation","df":"نوع العمل الذي يزاوله المشتغل في فترة الإسناد، سواء كان بأجر أو بدون أجر، بغض النظر عن مهنته الأصلية أو الرئيسية أو الثانوية أو مجال تعليمه.","src":[6],"tent":false},{"id":124,"ar":"المواصفات","en":"Specifications","df":"وصف دقيق للاحتياجات الخاصة الواجب الوفاء بها أو الخصائص الأساسية التي يسأل عنها العميل في خدمة أو سلعة أو نظام أو عمل، وتنقسم إلى مواصفات أداء ومواصفات فنية.","src":[3],"tent":false},{"id":125,"ar":"مواصفات البرنامج","en":"Program specifications","df":"تحديد تفاصيل تصميم البرنامج بغاياته وأهدافه العامة وبنيته ومحتوى أجزائه ومخرجات التعلم المقصودة وأساليب التعليم والتعلم والتقويم.","src":[4],"tent":false},{"id":126,"ar":"مواصفات الخريج","en":"Graduate specifications","df":"مجموعة الصفات التي يجب أن تتوافر في الخريج، وتشمل المعلومات والمفاهيم والمهارات المكتسبة لتؤهله للعمل والتعلم المستقبلي والبحث الأكاديمي بمستوى ملائم في تخصصه.","src":[4],"tent":false},{"id":127,"ar":"المؤتمرات والندوات وورش العمل","en":"Conferences, seminars and workshops","df":"وسيلة شائعة في التدريب تشجع التفكير الجماعي إزاء موضوع مشترك، وتتيح تبادل المعلومات والخبرات والآراء والوقوف على التطورات الحديثة، وفرصة الاطلاع على المعارض التي تقام على هامشها.","src":[8],"tent":false},{"id":128,"ar":"مؤسسات المعلومات","en":"Information institutions","df":"المؤسسات العاملة في مجال المعلومات، وهي: مؤسسات إنتاج المعلومات، ومؤسسات نشر المعلومات، ومؤسسات تيسير سبل الإفادة من المعلومات (مرافق المعلومات) مثل المكتبات ومراكز المعلومات على اختلاف أشكالها ومستوياتها.","src":[1],"tent":false},{"id":129,"ar":"المؤسسة","en":"Institute","df":"كل مؤسسة تعليمية حكومية أو غير حكومية تقدم برامج دراسية منتظمة لا تقل مدتها عن ثلاث سنوات بعد الثانوية العامة أو ما يعادلها وتهدف إلى منح درجة علمية، وكذلك مراكز البحث العلمي ومؤسساته.","src":[4],"tent":false},{"id":130,"ar":"المؤشرات","en":"Indicators","df":"علامة يمكن ملاحظتها داخل المعيار (كمية أو نوعية) تجعل المعايير إجرائية، ويُلجأ غالبًا إلى تحديد مؤشرات متعددة لتبيّن مدى احترام المعيار.","src":[3],"tent":false},{"id":131,"ar":"مؤشرات الأداء","en":"Performance indicators","df":"مقاييس كيفية وكمية تُستخدم لتتبع الأداء بمرور الوقت للاستدلال على مدى تلبية مستويات الأداء المتفق عليها، وهي نقاط فحص تراقب التقدم نحو تحقيق المعايير.","src":[4],"tent":false},{"id":132,"ar":"الموقع الإلكتروني","en":"Website","df":"مجموعة من صفحات الويب المترابطة المثبتة على خادم ويب ومتاحة على مدار الساعة لمستخدمي الإنترنت.","src":[7],"tent":false},{"id":133,"ar":"مؤهلات أكاديمية","en":"Academic qualifications","df":"ما يُمنح عند استكمال الطالب لبرنامج الدراسة، مثل الشهادة أو الدبلوم أو درجة البكالوريوس.","src":[4],"tent":false},{"id":134,"ar":"نسبة تحقق المعيار في المكتبة","en":"Standard compliance rate","df":"نسبة المؤشرات المتحققة فعليًا في المكتبة من إجمالي مؤشرات المعيار (المؤشرات المتحققة ÷ إجمالي المؤشرات × 100) لقياس مدى التزامها بالمعيار.","src":[],"tent":true},{"id":135,"ar":"وحدة الأمر","en":"Unity of command","df":"تلقّي المرؤوس الأوامر مباشرة من رئيس واحد فقط هو رئيسه المباشر، ولا يرفع تقاريره إلا إليه.","src":[1],"tent":false},{"id":136,"ar":"وسائل الإيضاح السمعية البصرية","en":"Audiovisual techniques","df":"أسلوب يعتمد على إثارة اهتمام المتدربين باستخدام الأفلام والتلفزيون والشرائح والخرائط والرسومات وغيرها لتوصيل المعلومات إلى المتدرب بطريقة سهلة وسريعة.","src":[8],"tent":false}]}</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS='أبتثجحخدذرزسشصضطظعغفقكلمنهوي';
const KEYORD='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const norm=s=>s.replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase();
const letterOf=a=>{const c=norm(a.replace(/^ال/,''))[0]||'';return c==='ا'?'أ':c};
const keyOf=a=>[...norm(a.replace(/\(.*?\)/g,'').trim()).replace(/^ال/,'')].map(c=>c===' '?0:KEYORD.indexOf(c)>=0?KEYORD.indexOf(c)+1:99);
const cmpKeys=(a,b)=>{for(let i=0;i<Math.min(a.length,b.length);i++){if(a[i]!==b[i])return a[i]-b[i]}return a.length-b.length};
const clone=o=>JSON.parse(JSON.stringify(o));
const cleanOf=d=>({v:d.v,ph:d.ph,showBtn:d.showBtn!==false,refs:d.refs,sites:d.sites||[],terms:d.terms.map(({id,ar,en,df,src,tent})=>({id,ar,en,df,src,tent}))});
const DATA0=JSON.parse($('data').textContent);
const LS='glossary-draft-v2';
let DB=clone(DATA0),TERMS=[],REFS={};
const store={get(k,s){try{return(s?sessionStorage:localStorage).getItem(k)}catch(e){return this['m'+k]||null}},set(k,v,s){try{(s?sessionStorage:localStorage).setItem(k,v)}catch(e){this['m'+k]=v}},del(k,s){try{(s?sessionStorage:localStorage).removeItem(k)}catch(e){delete this['m'+k]}}};
const isAdmin=()=>store.get('adm',true)==='1';
function loadDraft(){try{const d=JSON.parse(store.get(LS));if(d&&d.base===DATA0.v)return d.data}catch(e){}return null}
function saveDraft(){store.set(LS,JSON.stringify({base:DATA0.v,data:cleanOf(DB)}));reindex();try{if(store.get('adm',true))schedPub()}catch(e){}}
function reindex(){TERMS=DB.terms;REFS=DB.refs;if(!Array.isArray(DB.sites))DB.sites=[];TERMS.forEach(t=>{t.L=letterOf(t.ar);t.blob=norm(t.ar+' '+t.en+' '+t.df)})}
const refIds=()=>Object.keys(REFS).sort((a,b)=>REFS[a].order-REFS[b].order);
const fmtApa=a=>esc(a).replace(/\*(.+?)\*/g,'<i>$1</i>');
const plainApa=a=>a.replace(/\*/g,'');
const state={q:'',L:'',tent:false,src:0};
function hl(text,q){
  if(!q)return esc(text);
  const toks=norm(q).split(/\s+/).filter(Boolean);const n=norm(text);
  if(n.length!==text.length)return esc(text);
  let out='',i=0;const ranges=[];
  toks.forEach(k=>{let p=0;while((p=n.indexOf(k,p))>-1){ranges.push([p,p+k.length]);p+=k.length}});
  ranges.sort((a,b)=>a[0]-b[0]);
  ranges.forEach(([s,e])=>{if(s<i)return;out+=esc(text.slice(i,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';i=e});
  return out+esc(text.slice(i));
}
function matches(t,ignoreL){
  if(!ignoreL&&state.L&&t.L!==state.L)return false;
  if(state.tent&&!t.tent)return false;
  if(state.src&&!t.src.includes(state.src))return false;
  if(state.q){const k=norm(state.q).split(/\s+/).filter(Boolean);if(!k.every(w=>t.blob.includes(w)))return false}
  return true;
}
/* ---------- public: terms ---------- */
function renderTerms(){
  const rows=TERMS.filter(t=>matches(t));
  $('count').textContent=rows.length+' من '+TERMS.length+' مصطلح';
  let html='',cur='';
  rows.forEach(t=>{
    if(t.L!==cur){cur=t.L;html+='<div class="group" aria-hidden="true">'+cur+'</div>'}
    html+='<article class="card" id="t'+t.id+'"><div class="head"><div class="ar">'+hl(t.ar,state.q)+'</div><div class="en">'+hl(t.en,state.q)+'</div></div>'
    +'<p class="df">'+hl(t.df,state.q)+'</p><div class="meta">'
    +t.src.filter(n=>REFS[n]).map(n=>'<button class="src" data-ref="'+n+'" title="افتح المرجع">['+n+']</button>').join('')
    +(t.tent?'<span class="tent">* مبدئي</span>':'')
    +'<button class="copy" data-copy="'+t.id+'">نسخ</button></div></article>';
  });
  $('list').innerHTML=html||'<div class="empty">لا توجد نتائج. جرّب كلمة أخرى أو أزل الفلتر.</div>';
  const has=new Set(TERMS.filter(t=>matches(t,true)).map(t=>t.L));
  document.querySelectorAll('#letters button').forEach(b=>{b.disabled=!has.has(b.dataset.l)&&state.L!==b.dataset.l;b.setAttribute('aria-pressed',state.L===b.dataset.l)});
}
function renderChips(){
  $('srcChips').innerHTML=refIds().map(n=>'<button class="chip" data-s="'+n+'" aria-pressed="'+(state.src==n)+'" title="'+esc(REFS[n].short)+'">['+n+'] '+esc(REFS[n].short)+'</button>').join('');
}
function renderHead(){
  $('admBtn').hidden=!(DB.showBtn!==false||isAdmin());
  $('sub').textContent=TERMS.length+' مصطلحًا مرتبة هجائيًا من '+Object.keys(REFS).length+' مصادر. اضغط على رقم المرجع [n] لفتح بياناته، أو ادخل على «المصادر» لتصفحها كلها.';
}
$('letters').innerHTML=[...LETTERS].map(l=>'<button data-l="'+l+'" aria-pressed="false">'+l+'</button>').join('');
/* ---------- public: sources ---------- */
function renderSources(){
  $('srcIntro').textContent='كل المصادر المستخدمة في القاموس. اضغط «فتح المصدر» للدخول عليه، أو «عرض مصطلحاته» لتشوف المصطلحات المأخوذة منه.';
  $('srcList').innerHTML=refIds().map(n=>{
    const r=REFS[n],c=TERMS.filter(t=>t.src.includes(+n)||t.src.includes(n)).length;
    return '<article class="scard" id="s'+n+'"><div class="shead"><span class="snum">['+n+']</span>'+(r.kind?'<span class="kind">'+esc(r.kind)+'</span>':'')+'<span class="muted">'+c+' مصطلح</span></div>'
    +'<p class="sapa" dir="'+(r.ltr?'ltr':'rtl')+'">'+fmtApa(r.apa)+'</p>'+attList(n,r)+'<div class="sact">'
    +(r.url?'<a class="btn solid" href="'+esc(r.url)+'" target="_blank" rel="noopener">فتح المصدر ↗</a>':'<span class="muted">لا يوجد رابط إلكتروني لهذا المصدر</span>')
    +'<button class="btn" data-showterms="'+n+'">عرض مصطلحاته ('+c+')</button><button class="btn plain" data-copyref="'+n+'">نسخ المرجع</button></div></article>';
  }).join('')+siteSections();
}
const googleUrl=n=>'https://www.google.com/search?q='+encodeURIComponent(n);
function siteSections(){
  const cats=[];DB.sites.forEach(s=>{if(!cats.includes(s.cat))cats.push(s.cat)});
  if(!cats.length)return '';

async function gh(c,path,method,body){
  const r=await fetch('https://api.github.com/repos/'+c.o+'/'+c.r+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+(method==='GET'||!method?'?ref='+encodeURIComponent(c.b||'main'):''),{method:method||'GET',headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(r.status===401||r.status===403)throw new Error('auth');
  if(r.status===404&&(method||'GET')==='GET')return null;
  if(!r.ok)throw new Error('http'+r.status);
  return r.json();
}
function setPub(m,busy){pubMsg=m;const e=$('pubstat');if(e){e.textContent=m;e.hidden=!m}}
async function publishGH(){
  const c=ghCfg();
  if(!c.o||!c.r||!c.t){setPub('اضبطي إعدادات النشر الأول (زرار «إعدادات النشر»).');return}
  if(pubBusy){pubAgain=true;return}
  pubBusy=true;pubAgain=false;setPub('جاري النشر على الموقع…');
  try{
    const res=await fetch(location.pathname+location.search,{cache:'no-store'});const src=await res.text();
    const re=/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(src))throw new Error('nodata');
    const out=cleanOf(DB);out.v=new Date().toISOString();
    const html=src.replace(re,(m,x,y)=>x+JSON.stringify(out).replace(/</g,'\\u003c')+y);
    const fl=[];Object.values(DB.refs).forEach(r=>(r.att||[]).forEach(x=>{if(x.kind==='file')fl.push(x)}));
    for(const x of fl){
      const ex=await gh(c,x.path);if(ex)continue;
      const rec=await idb.get(x.id);if(!rec)continue;
      setPub('جاري رفع الملف: '+x.name+'…');
      await gh(c,x.path,'PUT',{message:'add '+x.name,branch:c.b||'main',content:await blobB64(rec.blob)});
    }
    const cur=await gh(c,'index.html');
    await gh(c,'index.html','PUT',{message:'update glossary',branch:c.b||'main',content:b64u(html),sha:cur&&cur.sha});
    setPub('اتنشر ✓ — الموقع هيتحدّث لكل الزوار خلال دقيقة تقريبًا.');
  }catch(e){
    setPub(e.message==='auth'?'GitHub رفض التوكن. اتأكدي إنه صحيح وفيه صلاحية Contents: Read and write على الريبو.':e.message==='nodata'?'النشر بيشتغل بس من الموقع بعد ما يتنشر.':'تعذر النشر ('+e.message+'). اتأكدي من الإنترنت وإعدادات النشر.');
  }
  pubBusy=false;if(pubAgain)schedPub(500);
}

function dl(name,text,type){const b=text instanceof Blob?text:new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
async function exportHtml(btn){
  const old=btn.textContent;btn.textContent='جاري التجهيز…';
  try{
    const res=await fetch(location.pathname+location.search,{cache:'no-store'});
    const src=await res.text();
    const re=/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(src))throw new Error('nodata');
    const out=cleanOf(DB);out.v=new Date().toISOString();
    const json=JSON.stringify(out).replace(/</g,'\\u003c');
    const html=src.replace(re,(m,a,b)=>a+json+b);
    const fl=[];Object.values(DB.refs).forEach(r=>(r.att||[]).forEach(x=>{if(x.kind==='file')fl.push(x)}));
    if(!fl.length){dl('index.html',html,'text/html;charset=utf-8');btn.textContent='تم التنزيل ✓'}
    else{
      const ents=[{name:'index.html',data:new TextEncoder().encode(html)}];const miss=[];
      for(const x of fl){let blob=null;const rec=await idb.get(x.id);if(rec)blob=rec.blob;else{try{const r2=await fetch(x.path,{cache:'no-store'});if(r2.ok)blob=await r2.blob()}catch(e){}}
        if(blob)ents.push({name:x.path,data:new Uint8Array(await blob.arrayBuffer())});else miss.push(x.name)}
      dl('glossary-site.zip',makeZip(ents),'application/zip');btn.textContent='تم التنزيل ✓';
      alert0('نزلت ملف glossary-site.zip. فكّي الضغط وارفعي index.html وفولدر files على GitHub (اسحبي الاتنين مع بعض).'+(miss.length?' ملفات مش لاقياها وما اتضمنتش: '+miss.join('، '):''));
    }
  }catch(e){btn.textContent='تعذر التنزيل';alert0('تنزيل النسخة المحدّثة بيشتغل من الموقع بعد رفعه على Vercel. حاليًا نزّل «نسخة احتياطية JSON» واحتفظ بيها.')}
  setTimeout(()=>btn.textContent=old,2200);
}

document.addEventListener('click',async e=>{
  const T=e.target;
  let x;
  if((x=T.closest('[data-submit]'))){e.preventDefault();handleSubmit(x.closest('form'));return}
  if((x=T.closest('[data-nav]'))){nav(x.dataset.nav);return}
  if((x=T.closest('[data-view]'))){nav(x.dataset.view);return}
  if((x=T.closest('[data-l]'))&&x.closest('#letters')){if(x.disabled)return;state.L=state.L===x.dataset.l?'':x.dataset.l;renderTerms();return}
  if((x=T.closest('[data-s]'))){const n=+x.dataset.s;state.src=state.src===n?0:n;renderChips();renderTerms();return}
  if(T.closest('#fTent')){state.tent=!state.tent;$('fTent').setAttribute('aria-pressed',state.tent);renderTerms();return}
  if((x=T.closest('[data-ref]'))){openDrawer(refHtml(x.dataset.ref));return}
  if((x=T.closest('[data-go]'))){goTerm(+x.dataset.go);return}
  if((x=T.closest('[data-gosrc]'))){closeDrawer();nav('sources');setTimeout(()=>{const el=$('s'+x.dataset.gosrc);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}},50);return}
  if((x=T.closest('[data-showterms]'))){state.q='';state.L='';state.tent=false;state.src=+x.dataset.showterms;$('q').value='';$('fTent').setAttribute('aria-pressed',false);nav('terms');return}
  if((x=T.closest('[data-copy]'))){const t=TERMS.find(t=>t.id==x.dataset.copy);copyText(x,t.ar+' ('+t.en+'): '+t.df+(t.src.length?' ['+t.src.join('، ')+']':''),'نسخ');return}
  if((x=T.closest('[data-copyref]'))){copyText(x,plainApa(REFS[x.dataset.copyref].apa),'نسخ المرجع');return}
  if(T.id==='scrim'||T.id==='close'){closeDrawer();return}
  if((x=T.closest('[data-atab]'))){aTab=x.dataset.atab;aq='';pendDel=null;renderAdmin();return}
  if((x=T.closest('[data-esi]'))){siteForm(x.dataset.esi);return}
  if((x=T.closest('[data-dsi]'))){const k='i'+x.dataset.dsi;if(pendDel===k){DB.sites=DB.sites.filter(s=>String(s.id)!==x.dataset.dsi);pendDel=null;saveDraft();renderAdmin()}else{pendDel=k;renderAList();clearTimeout(pendT);pendT=setTimeout(()=>{pendDel=null;if($('alist'))renderAList()},4000)}return}
  if((x=T.closest('[data-prev]'))){const [r0,a0]=x.dataset.prev.split(':');openPreview(r0,a0);return}
  if((x=T.closest('[data-rmatt]'))){formAtt.splice(+x.dataset.rmatt,1);refAtt();return}
  if(T.closest('[data-addlink]')){addLink();return}
  if((x=T.closest('[data-et]'))){termForm(TERMS.find(t=>t.id==x.dataset.et));return}
  if((x=T.closest('[data-es]'))){srcForm(x.dataset.es);return}
  if((x=T.closest('[data-dt]'))){const k='t'+x.dataset.dt;if(pendDel===k){DB.terms=DB.terms.filter(t=>t.id!=x.dataset.dt);pendDel=null;saveDraft();renderAdmin()}else{pendDel=k;renderAList();clearTimeout(pendT);pendT=setTimeout(()=>{pendDel=null;if($('alist'))renderAList()},4000)}return}
  if((x=T.closest('[data-ds]'))){const n=x.dataset.ds,k='s'+n;if(pendDel===k){delete DB.refs[n];DB.terms.forEach(t=>{t.src=t.src.filter(s=>String(s)!==String(n))});pendDel=null;saveDraft();renderAdmin()}else{pendDel=k;renderAList();clearTimeout(pendT);pendT=setTimeout(()=>{pendDel=null;if($('alist'))renderAList()},4000)}return}
  if((x=T.closest('[data-a]'))){
    const a=x.dataset.a;
    if(a==='newterm')termForm(null);
    else if(a==='newsrc')srcForm(null);
    else if(a==='newsite')siteForm(null);
    else if(a==='cancel')closeDrawer();
    else if(a==='out')leaveAdmin();
    else if(a==='pass')passForm();
    else if(a==='togbtn'){DB.showBtn=DB.showBtn===false;saveDraft();renderAdmin()}
    else if(a==='export')exportHtml(x);
    else if(a==='ghset')ghForm();
    else if(a==='ghpub'){clearTimeout(pubT);publishGH()}
    else if(a==='ghsave'){const c={o:$('g_o').value.trim(),r:$('g_r').value.trim(),b:$('g_b').value.trim()||'main',t:$('g_t').value.trim(),auto:$('g_a').checked};if(!c.o||!c.r||!c.t){$('ferr').textContent='كمّلي كل الخانات.';return}store.set(GHK,JSON.stringify(c));closeDrawer();setPub('اتحفظت إعدادات النشر.');renderAdmin();publishGH()}
    else if(a==='json')dl('glossary-backup.json',JSON.stringify(cleanOf(DB),null,1),'application/json');
    else if(a==='reset'){if(pendDel==='reset'){store.del(LS);DB=clone(DATA0);reindex();pendDel=null;renderAdmin()}else{pendDel='reset';x.textContent='تأكيد التجاهل';clearTimeout(pendT);pendT=setTimeout(()=>{pendDel=null;x.textContent='تجاهل التعديلات'},4000)}}
  }
});

async function handleSubmit(form){
  const e={target:form};const id=form.id;
  if(id==='lf'){
    try{const h=await hashPw($('lpw').value);if(h===DATA0.ph){store.set('adm','1',true);enterAdmin()}else{$('lerr').textContent='كلمة المرور غير صحيحة.';$('lpw').value='';$('lpw').focus()}}
    catch(_){$('lerr').textContent='حصل خطأ غير متوقع. حدّث الصفحة وجرّب تاني.'}
  }else if(id==='ftf'){
    const tid=e.target.dataset.id,ar=$('f_ar').value.trim(),en=$('f_en').value.trim(),df=$('f_df').value.trim();
    if(!ar||!df){$('ferr').textContent='اكتب الكلمة العربية والتعريف.';return}
    if(TERMS.some(t=>t.ar===ar&&String(t.id)!==tid)){$('ferr').textContent='المصطلح ده موجود بالفعل، عدّل عليه بدل ما تضيفه تاني.';return}
    const src=[...document.querySelectorAll('input[name=fs]:checked')].map(c=>+c.value);
    const t={id:tid?+tid:Math.max(0,...DB.terms.map(x=>x.id))+1,ar,en,df,src,tent:$('f_tent').checked};
    if(tid)DB.terms=DB.terms.filter(x=>String(x.id)!==tid);
    const k=keyOf(ar);const i=DB.terms.findIndex(x=>cmpKeys(keyOf(x.ar),k)>0);
    if(i<0)DB.terms.push(t);else DB.terms.splice(i,0,t);
    saveDraft();closeDrawer();renderAdmin();
  }else if(id==='fsf'){
    const sid=e.target.dataset.id,short=$('s_short').value.trim(),apa=$('s_apa').value.trim(),url=$('s_url').value.trim();
    if(!short||!apa){$('ferr').textContent='اكتب الاسم المختصر والمرجع.';return}
    if(url&&!/^https?:\/\//i.test(url)){$('ferr').textContent='الرابط لازم يبدأ بـ https://';return}
    const n=sid||String(Math.max(0,...Object.keys(DB.refs).map(Number))+1);
    DB.refs[n]={order:parseFloat($('s_order').value)||99,short,apa,kind:$('s_kind').value,url,ltr:$('s_ltr').checked,att:clone(formAtt)};
    saveDraft();closeDrawer();renderAdmin();
  }else if(id==='fsif'){
    const sid=e.target.dataset.id,name=$('i_name').value.trim(),url=$('i_url').value.trim(),cat=$('i_cat').value.trim();
    if(!name||!cat){$('ferr').textContent='اكتب اسم الموقع والتصنيف.';return}
    if(url&&!/^https?:\/\//i.test(url)){$('ferr').textContent='الرابط لازم يبدأ بـ https://';return}
    const o={id:sid?+sid:Math.max(0,...DB.sites.map(x=>x.id))+1,name,desc:$('i_desc').value.trim(),url,cat};
    const i=DB.sites.findIndex(x=>String(x.id)===sid);if(i>=0)DB.sites[i]=o;else DB.sites.push(o);
    saveDraft();closeDrawer();renderAdmin();
  }else if(id==='fpf'){
    try{
      if(await hashPw($('p_old').value)!==DB.ph){$('ferr').textContent='كلمة المرور الحالية غير صحيحة.';return}
      if($('p_new').value!==$('p_new2').value){$('ferr').textContent='كلمتا المرور غير متطابقتين.';return}
      DB.ph=await hashPw($('p_new').value);saveDraft();closeDrawer();renderAdmin();
      alert0('اتغيرت كلمة المرور. هتشتغل بعد تنزيل النسخة المحدّثة ورفعها.');
    }catch(_){$('ferr').textContent='تعذر تغيير كلمة المرور من هذا المتصفح.'}
  }
}

}
